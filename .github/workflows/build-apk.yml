name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - 'app/**'
      - 'shared/**'
      - 'desktopApp/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Build Android APK
        shell: bash
        run: timeout --signal=TERM --kill-after=30s 25m ./gradlew :app:assembleContinuous --no-daemon --console=plain --stacktrace --info -DskipFormatKtlint

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: NewPipe-Android-APK
          path: app/build/outputs/apk/continuous/*.apk
          if-no-files-found: error
          retention-days: 14
